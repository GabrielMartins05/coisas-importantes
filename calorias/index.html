<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia Genial</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="topo">
            <a href="../index.html" class="link-voltar">← Painel de tarefas</a>
        </div>

        <!-- TELA DE CADASTRO / EDIÇÃO DE PERFIL -->
        <section id="tela-cadastro">
            <h1>Academia Genial</h1>
            <form id="form-cadastro">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>

                <label for="peso">Peso atual (kg):</label>
                <input type="number" id="peso" name="peso" step="0.1" min="30" max="300" required>

                <label for="peso_meta">Meta de peso (kg):</label>
                <input type="number" id="peso_meta" name="peso_meta" step="0.1" min="30" max="300" required>

                <label for="altura">Altura (cm):</label>
                <input type="number" id="altura" name="altura" min="100" max="250" required>

                <label for="idade">Idade:</label>
                <input type="number" id="idade" name="idade" min="14" max="100" required>

                <label for="sexo">Sexo:</label>
                <select name="sexo" id="sexo" required>
                    <option value="M">Masculino</option>
                    <option value="F">Feminino</option>
                </select>

                <label for="atividade">Atividade:</label>
                <select name="atividade" id="atividade" required>
                    <option value="1.2">Sedentário</option>
                    <option value="1.35">Leve</option>
                    <option value="1.55">Moderado</option>
                    <option value="1.72">Intenso</option>
                </select>

                <label for="deficit">Objetivo:</label>
                <select name="deficit" id="deficit" required>
                    <option value="500">Perder 0.5 kg por semana</option>
                    <option value="750">Perder 0.75 kg por semana</option>
                    <option value="1000">Perder 1 kg por semana</option>
                </select>

                <button type="submit">Calcular</button>
                <button type="button" id="btn-cancelar-cadastro" class="btn-secundario" hidden>Cancelar</button>
            </form>
        </section>

        <!-- DASHBOARD -->
        <section id="tela-dashboard" hidden>
            <h2 id="saudacao">Bem-vindo!</h2>

            <table class="tabela-stats">
                <tr><th>Peso Atual</th><td id="stat-peso-atual"></td></tr>
                <tr><th>Peso Meta</th><td id="stat-peso-meta"></td></tr>
                <tr><th>Meta calórica diária</th><td id="stat-meta-calorica"></td></tr>
                <tr><th>Déficit planejado</th><td id="stat-deficit-planejado"></td></tr>
                <tr id="linha-deficit-real" hidden><th id="label-deficit-real">Déficit médio real</th><td id="stat-deficit-real"></td></tr>
            </table>

            <p class="destaque" id="destaque-meta"></p>

            <button type="button" id="btn-editar-perfil" class="btn-secundario">Editar perfil</button>

            <h2>Novo Registro do Dia</h2>
            <form id="form-registro">
                <label for="reg-data">Data:</label>
                <input type="date" name="data" id="reg-data" required>

                <label for="reg-peso">Peso de hoje (kg): <small>(opcional)</small></label>
                <input type="number" name="peso" id="reg-peso" step="0.1" min="30" max="300" placeholder="Ex: 77.6">

                <label for="reg-calorias">Calorias consumidas: <small>(opcional)</small></label>
                <input type="number" name="calorias" id="reg-calorias" min="0" max="10000" placeholder="Ex: 1500">

                <button type="submit">Salvar Registro</button>
                <button type="button" id="btn-cancelar-registro" class="btn-secundario" hidden>Cancelar edição</button>
            </form>

            <h2>Diário Calórico</h2>
            <p id="sem-registros">Nenhum registro ainda. Que tal adicionar o de hoje?</p>
            <table id="tabela-historico" hidden>
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Peso</th>
                        <th>Consumido</th>
                        <th>Meta</th>
                        <th>Status</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody id="corpo-historico"></tbody>
            </table>
        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
